</head>
<body>


  <header>
    <a href="index.html" class="logo">SASI-UFRRJ</a>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="hamburguer">&#9776;</label>

    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="programacao.html">Programação</a></li>

        <li><a href="submissao.html">Palestrante</a></li>
        <li><a href="painel-comissao.html">Comissão</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Submeter proposta</h1>

    <form method="post">

      <fieldset>
        <legend>Dados da proposta</legend>

        <label for="titulo">Título da proposta</label>
        <input type="text" id="titulo" name="titulo" required>

        <label for="tipo">Tipo (oficina ou minicurso)</label>
        <select id="tipo" name="tipo" required>
          <option value="">Selecione</option>
          <option value="oficina">Oficina</option>
          <option value="minicurso">Minicurso</option>
        </select>

        <label for="resumo">Resumo</label>
        <textarea id="resumo" name="resumo" rows="5" required></textarea>

        <label for="carga-horaria">Carga horária (horas)</label>
        <input type="number" id="carga-horaria" name="carga-horaria" min="1" required>

        <label for="vagas">Número de vagas</label>
        <input type="number" id="vagas" name="vagas" min="1" required>

        <label for="publico">Público-alvo</label>
        <input type="text" id="publico" name="publico">
      </fieldset>

      <fieldset>
        <legend>Dados do ministrante</legend>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="instituicao">Instituição</label>
        <input type="text" id="instituicao" name="instituicao">

        <label for="minibio">Mini-biografia</label>
        <textarea id="minibio" name="minibio" rows="5"></textarea>
      </fieldset>

      <button type="submit" class="botao">Enviar proposta</button>
    </form>

    <p><a href="requisitos-materiais.html">Próximo passo: requisitos e materiais &rsaquo;</a></p>
  </main>
